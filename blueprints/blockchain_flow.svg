    <text x="270" y="111" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">User: 0xABC...</text>
    <text x="270" y="124" font-family="Arial" font-size="7" fill="#999" text-anchor="middle">2026-03-02 10:15:35</text>
    
    <!-- Arrow -->
    <line x1="345" y1="92" x2="375" y2="92" stroke="#c2185b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Block 3 -->
