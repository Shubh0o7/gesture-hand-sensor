    <text x="100" y="170" font-family="Arial" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="bold">📤 Send Transaction</text>
    <text x="100" y="183" font-family="monospace" font-size="8" fill="#666" text-anchor="middle">contract.logCommand()</text>
