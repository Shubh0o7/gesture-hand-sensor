    <rect x="0" y="0" width="440" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="440" height="30" rx="10" fill="#4caf50"/>
    <text x="220" y="21" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🎯 SECURITY BENEFITS</text>
    
    <text x="20" y="50" font-family="Arial" font-size="10" fill="#37474f">✓ Immutable audit trail - commands cannot be altered</text>
    <text x="20" y="65" font-family="Arial" font-size="10" fill="#37474f">✓ Command provenance - prove who issued each command</text>
    <text x="20" y="80" font-family="Arial" font-size="10" fill="#37474f">✓ Timestamp verification - exact time of each action</text>
    <text x="20" y="95" font-family="Arial" font-size="10" fill="#37474f">✓ Decentralized security - no single point of failure</text>
  </g>
  
  <!-- Files -->
