    <text x="450" y="70" font-family="Arial" font-size="10" fill="#c2185b" text-anchor="middle" font-weight="bold">Block #3</text>
    <text x="450" y="85" font-family="monospace" font-size="7" fill="#37474f" text-anchor="middle">Hash: 0x4e8d...</text>
    <text x="450" y="98" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Cmd: STOP</text>
    <text x="450" y="111" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">User: 0xABC...</text>
    <text x="450" y="124" font-family="Arial" font-size="7" fill="#999" text-anchor="middle">2026-03-02 10:15:38</text>
    
    <!-- Arrow -->
    <line x1="525" y1="92" x2="555" y2="92" stroke="#c2185b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Block N -->
    <rect x="560" y="50" width="140" height="85" rx="8" fill="url(#blockGrad)" stroke="#c2185b" stroke-width="2"/>
    <text x="630" y="70" font-family="Arial" font-size="10" fill="#c2185b" text-anchor="middle" font-weight="bold">Block #N</text>
    <text x="630" y="85" font-family="monospace" font-size="7" fill="#37474f" text-anchor="middle">Hash: 0x...</text>
    <text x="630" y="98" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Cmd: ...</text>
    <text x="630" y="111" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">User: ...</text>
    <text x="630" y="124" font-family="Arial" font-size="7" fill="#999" text-anchor="middle">Timestamp</text>
    
