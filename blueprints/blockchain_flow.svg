  <text x="500" y="685" font-family="Arial" font-size="11" fill="#ffe0b2" text-anchor="middle">Phase 4: Decentralized Security | Ganache + Solidity + Web3.py | Command Provenance & Immutable Audit Trail | © 2026</text>
