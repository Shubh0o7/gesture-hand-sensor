    <rect x="0" y="0" width="440" height="100" rx="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="440" height="30" rx="10" fill="#ffc107"/>
    <text x="220" y="21" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📁 PROJECT FILES</text>
    
