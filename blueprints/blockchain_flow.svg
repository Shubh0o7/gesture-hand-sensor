    <text x="100" y="115" font-family="Arial" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="bold">🔐 SHA-256 Hash</text>
    <text x="100" y="130" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Command + Timestamp + UserID</text>
    
    <!-- Transaction -->
