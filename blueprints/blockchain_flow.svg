    <text x="110" y="120" font-family="Arial" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="bold">🗣️ NLP Command Parser</text>
    <text x="110" y="133" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">gesture_nlp.py</text>
    
