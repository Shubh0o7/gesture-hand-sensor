    <text x="110" y="170" font-family="monospace" font-size="9" fill="#0d47a1" text-anchor="middle">{"action": "move",</text>
    <text x="110" y="183" font-family="monospace" font-size="9" fill="#0d47a1" text-anchor="middle">"speed": 0.5, "dir": "left"}</text>
