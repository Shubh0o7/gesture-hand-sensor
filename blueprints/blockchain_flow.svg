    <text x="110" y="27" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">🐍 PYTHON APPLICATION</text>
    
    <!-- Gesture Recognition -->
    <rect x="15" y="50" width="190" height="40" rx="5" fill="white" stroke="#1565c0" stroke-width="1"/>
    <text x="110" y="70" font-family="Arial" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="bold">✋ Gesture Recognition</text>
    <text x="110" y="83" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">Transformer Model Output</text>
    
    <!-- NLP Command -->
