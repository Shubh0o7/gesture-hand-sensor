    <text x="800" y="70" font-family="Arial" font-size="10" fill="#4caf50" text-anchor="middle" font-weight="bold">✅ VERIFICATION</text>
    <text x="800" y="90" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">• Tamper-proof records</text>
    <text x="800" y="105" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">• Command provenance</text>
    <text x="800" y="120" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">• Audit trail complete</text>
