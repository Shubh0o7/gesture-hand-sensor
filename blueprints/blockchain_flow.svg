    <text x="250" y="50" font-family="Arial" font-size="9" fill="#666">- Solidity smart contract</text>
    <text x="20" y="70" font-family="monospace" font-size="10" fill="#37474f">src/blockchain_bridge.py</text>
    <text x="250" y="70" font-family="Arial" font-size="9" fill="#666">- Web3.py integration</text>
    <text x="20" y="90" font-family="Arial" font-size="10" fill="#37474f">📦 Dependencies: web3, py-solc-x, eth-account</text>
