<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a148c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="attentionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="900" fill="#fafafa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="60" fill="url(#headerGrad)"/>
  <text x="500" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">TRANSFORMER ENCODER ARCHITECTURE - Phase 2</text>
  
  <!-- Input Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="url(#inputGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#1565c0"/>
    <text x="140" y="24" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">INPUT PROCESSING</text>
    
    <!-- Hand Landmarks -->
    <rect x="15" y="45" width="250" height="35" rx="5" fill="white" stroke="#1565c0" stroke-width="1"/>
    <text x="140" y="67" font-family="Arial" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="bold">✋ Hand Landmarks: 21 × 3 = 63 features</text>
    
    <!-- Sequence -->
    <rect x="15" y="90" width="250" height="35" rx="5" fill="white" stroke="#1565c0" stroke-width="1"/>
    <text x="140" y="112" font-family="Arial" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="bold">📊 Sequence: 30-60 frames (1-2 sec)</text>
    
    <!-- Tensor Shape -->
    <rect x="15" y="135" width="250" height="35" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="140" y="157" font-family="monospace" font-size="10" fill="#0d47a1" text-anchor="middle">Input Tensor: [batch, seq_len, 63]</text>
  </g>
  
  <!-- Arrow to Embedding -->
  <line x1="190" y1="265" x2="190" y2="295" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Embedding Layer -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" font-family="Arial" font-size="13" font-weight="bold" fill="#3949ab" text-anchor="middle">LINEAR EMBEDDING</text>
    <text x="140" y="45" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Projects 63 features → d_model (128/256)</text>
    <text x="140" y="65" font-family="monospace" font-size="9" fill="#37474f" text-anchor="middle">nn.Linear(63, d_model)</text>
  </g>
  
  <!-- Arrow to Positional -->
  <line x1="190" y1="385" x2="190" y2="415" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Positional Encoding -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" font-family="Arial" font-size="13" font-weight="bold" fill="#f57f17" text-anchor="middle">⏱️ POSITIONAL ENCODING</text>
    <text x="140" y="45" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Sinusoidal position embeddings</text>
    <text x="140" y="65" font-family="monospace" font-size="9" fill="#37474f" text-anchor="middle">PE(pos, 2i) = sin(pos/10000^(2i/d))</text>
  </g>
  
  <!-- Arrow to Encoder -->
  <line x1="190" y1="505" x2="190" y2="535" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Transformer Encoder Block -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="300" height="500" rx="10" fill="url(#encoderGrad)" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="40" rx="10" fill="#7b1fa2"/>
    <text x="150" y="27" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TRANSFORMER ENCODER BLOCK</text>
    <text x="150" y="60" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">× N layers (typically 4-6)</text>
    
    <!-- Multi-Head Attention -->
    <rect x="20" y="75" width="260" height="120" rx="8" fill="url(#attentionGrad)" stroke="#f57c00" stroke-width="2"/>
    <text x="150" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">🎯 MULTI-HEAD SELF-ATTENTION</text>
    
    <rect x="35" y="105" width="70" height="35" rx="4" fill="white" stroke="#f57c00" stroke-width="1"/>
    <text x="70" y="127" font-family="Arial" font-size="9" fill="#e65100" text-anchor="middle">Query (Q)</text>
    
    <rect x="115" y="105" width="70" height="35" rx="4" fill="white" stroke="#f57c00" stroke-width="1"/>
    <text x="150" y="127" font-family="Arial" font-size="9" fill="#e65100" text-anchor="middle">Key (K)</text>
    
    <rect x="195" y="105" width="70" height="35" rx="4" fill="white" stroke="#f57c00" stroke-width="1"/>
    <text x="230" y="127" font-family="Arial" font-size="9" fill="#e65100" text-anchor="middle">Value (V)</text>
    
    <text x="150" y="160" font-family="monospace" font-size="8" fill="#37474f" text-anchor="middle">Attention(Q,K,V) = softmax(QK^T/√d_k)V</text>
    <text x="150" y="180" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">8 attention heads</text>
    
    <!-- Add & Norm 1 -->
    <rect x="20" y="205" width="260" height="40" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="150" y="230" font-family="Arial" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="bold">➕ Add & LayerNorm</text>
    
    <!-- Feed Forward -->
    <rect x="20" y="255" width="260" height="100" rx="8" fill="white" stroke="#7b1fa2" stroke-width="2"/>
    <text x="150" y="280" font-family="Arial" font-size="12" font-weight="bold" fill="#7b1fa2" text-anchor="middle">🔄 FEED-FORWARD NETWORK</text>
    <text x="150" y="305" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Two linear transformations with ReLU</text>
    <text x="150" y="325" font-family="monospace" font-size="9" fill="#37474f" text-anchor="middle">FFN(x) = Linear(ReLU(Linear(x)))</text>
    <text x="150" y="345" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">d_ff = 4 × d_model (512/1024)</text>
    
    <!-- Add & Norm 2 -->
    <rect x="20" y="365" width="260" height="40" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
    <text x="150" y="390" font-family="Arial" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="bold">➕ Add & LayerNorm</text>
    
    <!-- Dropout -->
    <rect x="20" y="415" width="260" height="35" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
    <text x="150" y="437" font-family="Arial" font-size="10" fill="#c2185b" text-anchor="middle">Dropout (p=0.1) for regularization</text>
    
    <!-- Residual Connection Arrow -->
    <path d="M 290 120 Q 310 120 310 300 Q 310 380 290 380" stroke="#9c27b0" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <text x="320" y="250" font-family="Arial" font-size="9" fill="#9c27b0" transform="rotate(90, 320, 250)">Residual</text>
  </g>
  
  <!-- Output Section -->
  <g transform="translate(670, 80)">
    <rect x="0" y="0" width="280" height="280" rx="10" fill="url(#outputGrad)" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#388e3c"/>
    <text x="140" y="24" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">OUTPUT CLASSIFICATION</text>
    
    <!-- Global Pooling -->
    <rect x="15" y="50" width="250" height="45" rx="5" fill="white" stroke="#388e3c" stroke-width="1"/>
    <text x="140" y="70" font-family="Arial" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="bold">📊 Global Average Pooling</text>
    <text x="140" y="87" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Aggregate sequence → single vector</text>
    
    <!-- Classification Head -->
    <rect x="15" y="105" width="250" height="60" rx="5" fill="white" stroke="#388e3c" stroke-width="1"/>
    <text x="140" y="125" font-family="Arial" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="bold">🎯 Classification Head</text>
    <text x="140" y="142" font-family="monospace" font-size="9" fill="#37474f" text-anchor="middle">Linear(d_model, num_classes)</text>
    <text x="140" y="158" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">num_classes = 5-10 gestures</text>
    
    <!-- Softmax -->
    <rect x="15" y="175" width="250" height="40" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
    <text x="140" y="200" font-family="Arial" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">Softmax → Probability Distribution</text>
    
    <!-- Output -->
    <rect x="15" y="225" width="250" height="45" rx="5" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
    <text x="140" y="245" font-family="Arial" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">✅ Predicted Gesture Class</text>
    <text x="140" y="262" font-family="Arial" font-size="9" fill="#2e7d32" text-anchor="middle">forward, backward, left, right, stop</text>
  </g>
  
  <!-- Hyperparameters -->
  <g transform="translate(670, 380)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#607d8b"/>
    <text x="140" y="24" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">⚙️ HYPERPARAMETERS</text>
    
    <text x="20" y="60" font-family="Arial" font-size="10" fill="#37474f">• d_model: 128 or 256</text>
    <text x="20" y="80" font-family="Arial" font-size="10" fill="#37474f">• num_heads: 8</text>
    <text x="20" y="100" font-family="Arial" font-size="10" fill="#37474f">• num_layers: 4-6</text>
    <text x="20" y="120" font-family="Arial" font-size="10" fill="#37474f">• d_ff: 512 or 1024</text>
    <text x="20" y="140" font-family="Arial" font-size="10" fill="#37474f">• dropout: 0.1</text>
    <text x="20" y="160" font-family="Arial" font-size="10" fill="#37474f">• learning_rate: 1e-4 (Adam)</text>
    <text x="20" y="180" font-family="Arial" font-size="10" fill="#37474f">• batch_size: 32</text>
  </g>
  
  <!-- Training Info -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="600" height="120" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="600" height="35" rx="10" fill="#4caf50"/>
    <text x="300" y="24" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">☁️ TRAINING ON GOOGLE COLAB</text>
    
    <text x="20" y="60" font-family="Arial" font-size="11" fill="#37474f">• Free GPU: NVIDIA T4 (16GB VRAM) or TPU v2</text>
    <text x="20" y="80" font-family="Arial" font-size="11" fill="#37474f">• Training time: ~30-60 minutes for 100 epochs</text>
    <text x="20" y="100" font-family="Arial" font-size="11" fill="#37474f">• Loss function: CrossEntropyLoss</text>
    
    <text x="320" y="60" font-family="Arial" font-size="11" fill="#37474f">• Optimizer: AdamW with weight decay</text>
    <text x="320" y="80" font-family="Arial" font-size="11" fill="#37474f">• Scheduler: CosineAnnealingLR</text>
    <text x="320" y="100" font-family="Arial" font-size="11" fill="#37474f">• Early stopping: patience=10</text>
  </g>
  
  <!-- Performance Metrics -->
  <g transform="translate(50, 740)">
    <rect x="0" y="0" width="900" height="80" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="900" height="35" rx="10" fill="#ff9800"/>
    <text x="450" y="24" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">📈 PG-LEVEL PERFORMANCE METRICS</text>
    
    <text x="30" y="60" font-family="Arial" font-size="11" fill="#37474f">✓ Processing Time: &lt; 300ms per prediction (real-time requirement)</text>
    <text x="350" y="60" font-family="Arial" font-size="11" fill="#37474f">✓ Accuracy: &gt; 95% on validation set</text>
    <text x="600" y="60" font-family="Arial" font-size="11" fill="#37474f">✓ Prediction Stability: No flickering labels</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="860" width="1000" height="40" fill="#4a148c"/>
  <text x="500" y="885" font-family="Arial" font-size="11" fill="#e1bee7" text-anchor="middle">transformer_model.py | train_transformer.ipynb | Gesture Recognition Transformer | © 2026</text>
</svg>