<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00695c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26a69a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="650" fill="#fafafa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1100" height="55" fill="url(#headerGrad)"/>
  <text x="550" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">📊 DATA PIPELINE - End-to-End Flow</text>
  
  <!-- Stage 1: Input -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="url(#inputGrad)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="150" height="35" rx="10" fill="#1565c0"/>
    <text x="75" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📷 INPUT</text>
    
    <rect x="10" y="45" width="130" height="45" rx="5" fill="white" stroke="#1565c0" stroke-width="1"/>
    <text x="75" y="65" font-family="Arial" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="bold">Webcam</text>
    <text x="75" y="82" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">30 FPS RGB Frames</text>
    
    <rect x="10" y="100" width="130" height="45" rx="5" fill="white" stroke="#1565c0" stroke-width="1"/>
    <text x="75" y="120" font-family="Arial" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="bold">OpenCV</text>
    <text x="75" y="137" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">cv2.VideoCapture()</text>
    
    <rect x="10" y="155" width="130" height="35" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="75" y="177" font-family="monospace" font-size="8" fill="#0d47a1" text-anchor="middle">[H, W, 3] uint8</text>
  </g>
  
  <!-- Arrow 1->2 -->
  <line x1="185" y1="175" x2="215" y2="175" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: Perception -->
  <g transform="translate(220, 75)">
    <rect x="0" y="0" width="170" height="200" rx="10" fill="url(#processGrad)" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="170" height="35" rx="10" fill="#7b1fa2"/>
    <text x="85" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✋ PERCEPTION</text>
    
    <rect x="10" y="45" width="150" height="50" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
    <text x="85" y="65" font-family="Arial" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="bold">MediaPipe Hands</text>
    <text x="85" y="82" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">21 Landmarks Detection</text>
    
    <rect x="10" y="105" width="150" height="40" rx="5" fill="white" stroke="#7b1fa2" stroke-width="1"/>
    <text x="85" y="125" font-family="Arial" font-size="10" fill="#7b1fa2" text-anchor="middle" font-weight="bold">Normalization</text>
    <text x="85" y="140" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Scale & Center Invariant</text>
    
    <rect x="10" y="155" width="150" height="35" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
    <text x="85" y="177" font-family="monospace" font-size="8" fill="#4a148c" text-anchor="middle">[21, 3] float32 (X,Y,Z)</text>
  </g>
  
  <!-- Arrow 2->3 -->
  <line x1="395" y1="175" x2="425" y2="175" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Sequence Buffer -->
  <g transform="translate(430, 75)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="150" height="35" rx="10" fill="#607d8b"/>
    <text x="75" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📦 BUFFER</text>
    
    <rect x="10" y="45" width="130" height="50" rx="5" fill="white" stroke="#607d8b" stroke-width="1"/>
    <text x="75" y="65" font-family="Arial" font-size="10" fill="#607d8b" text-anchor="middle" font-weight="bold">Sliding Window</text>
    <text x="75" y="82" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">30-60 Frames Queue</text>
    
    <rect x="10" y="105" width="130" height="40" rx="5" fill="white" stroke="#607d8b" stroke-width="1"/>
    <text x="75" y="125" font-family="Arial" font-size="10" fill="#607d8b" text-anchor="middle" font-weight="bold">FIFO Queue</text>
    <text x="75" y="140" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">collections.deque</text>
    
    <rect x="10" y="155" width="130" height="35" rx="5" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
    <text x="75" y="177" font-family="monospace" font-size="8" fill="#37474f" text-anchor="middle">[seq_len, 21, 3]</text>
  </g>
  
  <!-- Arrow 3->4 -->
  <line x1="585" y1="175" x2="615" y2="175" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: AI Model -->
  <g transform="translate(620, 75)">
    <rect x="0" y="0" width="170" height="200" rx="10" fill="url(#aiGrad)" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="170" height="35" rx="10" fill="#f57c00"/>
    <text x="85" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🧠 AI MODEL</text>
    
    <rect x="10" y="45" width="150" height="55" rx="5" fill="white" stroke="#f57c00" stroke-width="1"/>
    <text x="85" y="65" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle" font-weight="bold">Transformer Encoder</text>
    <text x="85" y="80" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Multi-Head Attention</text>
    <text x="85" y="93" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Feed-Forward Network</text>
    
    <rect x="10" y="110" width="150" height="35" rx="5" fill="white" stroke="#f57c00" stroke-width="1"/>
    <text x="85" y="130" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle" font-weight="bold">Classification Head</text>
    <text x="85" y="143" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Softmax Output</text>
    
    <rect x="10" y="155" width="150" height="35" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
    <text x="85" y="177" font-family="monospace" font-size="8" fill="#e65100" text-anchor="middle">gesture_class: str</text>
  </g>
  
  <!-- Arrow 4->5 -->
  <line x1="795" y1="175" x2="825" y2="175" stroke="#37474f" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 5: NLP -->
  <g transform="translate(830, 75)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="url(#outputGrad)" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="150" height="35" rx="10" fill="#388e3c"/>
    <text x="75" y="24" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🗣️ NLP</text>
    
    <rect x="10" y="45" width="130" height="45" rx="5" fill="white" stroke="#388e3c" stroke-width="1"/>
    <text x="75" y="65" font-family="Arial" font-size="10" fill="#388e3c" text-anchor="middle" font-weight="bold">SpaCy Parser</text>
    <text x="75" y="82" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Gesture → Command</text>
    
    <rect x="10" y="100" width="130" height="45" rx="5" fill="white" stroke="#388e3c" stroke-width="1"/>
    <text x="75" y="120" font-family="Arial" font-size="10" fill="#388e3c" text-anchor="middle" font-weight="bold">Intent Mapper</text>
    <text x="75" y="137" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Stateful Context</text>
    
    <rect x="10" y="155" width="130" height="35" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
    <text x="75" y="175" font-family="monospace" font-size="7" fill="#1b5e20" text-anchor="middle">{action, speed, dir}</text>
  </g>
  
  <!-- Output Branches -->
  <!-- Arrow to Blockchain -->
  <path d="M 980 175 L 1020 175 L 1020 350 L 200 350 L 200 400" stroke="#f57c00" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="610" y="340" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Audit Log</text>
  
  <!-- Arrow to Robot -->
  <path d="M 980 175 L 1020 175 L 1020 350 L 700 350 L 700 400" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#greenArrow)"/>
  <text x="860" y="340" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">Execute</text>
  
  <!-- Blockchain Output -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#f57c00"/>
    <text x="100" y="21" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">🔗 BLOCKCHAIN</text>
    
    <text x="100" y="52" font-family="Arial" font-size="10" fill="#e65100" text-anchor="middle" font-weight="bold">Ganache Testnet</text>
    <text x="100" y="70" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">CommandLogger.sol</text>
    <text x="100" y="88" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Immutable Audit Trail</text>
  </g>
  
  <!-- Robot Output -->
  <g transform="translate(600, 410)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#388e3c"/>
    <text x="100" y="21" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">🤖 ROBOT</text>
    
    <text x="100" y="52" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="bold">Webots TurtleBot3</text>
    <text x="100" y="70" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Motor Control API</text>
    <text x="100" y="88" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">Forward/Back/Turn/Stop</text>
  </g>
  
  <!-- Data Format Legend -->
  <g transform="translate(350, 530)">
    <rect x="0" y="0" width="400" height="90" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
    <text x="200" y="22" font-family="Arial" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">📋 DATA FORMATS AT EACH STAGE</text>
    
    <text x="20" y="45" font-family="monospace" font-size="9" fill="#1565c0">Input:</text>
    <text x="70" y="45" font-family="monospace" font-size="9" fill="#37474f">[480, 640, 3] uint8 RGB frame</text>
    
    <text x="20" y="60" font-family="monospace" font-size="9" fill="#7b1fa2">Landmarks:</text>
    <text x="90" y="60" font-family="monospace" font-size="9" fill="#37474f">[21, 3] float32 normalized XYZ</text>
    
    <text x="20" y="75" font-family="monospace" font-size="9" fill="#f57c00">Sequence:</text>
    <text x="85" y="75" font-family="monospace" font-size="9" fill="#37474f">[batch, 60, 63] tensor</text>
    
    <text x="220" y="45" font-family="monospace" font-size="9" fill="#388e3c">Output:</text>
    <text x="275" y="45" font-family="monospace" font-size="9" fill="#37474f">"forward" | "left" | "stop"</text>
    
    <text x="220" y="60" font-family="monospace" font-size="9" fill="#388e3c">Command:</text>
    <text x="285" y="60" font-family="monospace" font-size="9" fill="#37474f">{action, speed, direction}</text>
    
    <text x="220" y="75" font-family="monospace" font-size="9" fill="#f57c00">Hash:</text>
    <text x="260" y="75" font-family="monospace" font-size="9" fill="#37474f">bytes32 SHA-256</text>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="620" width="1100" height="30" fill="#00695c"/>
  <text x="550" y="640" font-family="Arial" font-size="10" fill="#b2dfdb" text-anchor="middle">Data Pipeline: Webcam → MediaPipe → Transformer → NLP → Blockchain + Robot | Real-time Processing < 300ms | © 2026</text>
</svg>